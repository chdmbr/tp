<!doctype html>
<!-- One shared box of files, opened by link. A page of its own, sharing no script and no style
     with anything else served nearby: whoever holds a room link should be able to read every
     byte this page is made of and learn nothing from it but how to list and send files.
     That is why there is no implementation note here naming anything else. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Files</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f4f2; --fg: #1b1a18; --muted: #6b6862;
  --card: #ffffff; --border: #d8d5cf; --accent: #3c6e57; --danger: #8c3a2e;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #171614; --fg: #ece9e3; --muted: #9a968d;
          --card: #201f1c; --border: #35322d; --accent: #78b494; --danger: #d78a7c; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 46rem; margin: 0 auto; padding: 1.25rem 1rem 5rem; }
h1 { font-size: 1.3rem; margin: 0 0 .15rem; }
.sub { color: var(--muted); font-size: .85rem; margin: 0 0 1.25rem; }
.sub b { font-weight: 600; color: var(--fg); }

#zone { border: 2px dashed var(--border); border-radius: .9rem; padding: 1.6rem 1rem; text-align: center;
        color: var(--muted); cursor: pointer; transition: border-color .12s, background .12s; }
#zone:hover, #zone.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); color: var(--fg); }
#zone.hide { display: none; }
#zone strong { display: block; color: var(--fg); font-size: 1rem; margin-bottom: .2rem; }
#tagbox { width: 100%; margin: .7rem 0 0; padding: .55rem .7rem; font: inherit; font-size: .9rem;
          background: var(--card); color: var(--fg); border: 1px solid var(--border); border-radius: .5rem; }

#filters { display: flex; flex-wrap: wrap; gap: .35rem; margin: 1.1rem 0 .5rem; }
#filters button { font: inherit; font-size: .8rem; padding: .15rem .6rem; border-radius: 1rem; cursor: pointer;
                  background: var(--card); color: var(--muted); border: 1px solid var(--border); }
#filters button.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }

ul { list-style: none; padding: 0; margin: .5rem 0 0; }
li { display: flex; align-items: center; gap: .7rem; padding: .6rem .75rem; margin-bottom: .4rem;
     background: var(--card); border: 1px solid var(--border); border-radius: .6rem; }
li .thumb { width: 2.6rem; height: 2.6rem; flex: none; border-radius: .35rem; object-fit: cover; background: var(--bg); }
li .ext { display: grid; place-items: center; font-size: .62rem; font-weight: 700; letter-spacing: .04em;
          color: var(--muted); text-transform: uppercase; border: 1px solid var(--border); }
li .meta { flex: 1; min-width: 0; }
li a.name { color: var(--fg); font-weight: 500; text-decoration: none; display: block;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
li a.name:hover { text-decoration: underline; }
li .small { font-size: .76rem; color: var(--muted); }
li .tag { display: inline-block; background: color-mix(in srgb, var(--accent) 16%, transparent);
          color: var(--accent); border-radius: 1rem; padding: 0 .5rem; margin-right: .4rem; font-size: .72rem; }
li .acts { display: flex; gap: .15rem; flex: none; }
li .acts button { font: inherit; font-size: .95rem; line-height: 1; padding: .35rem .45rem; cursor: pointer;
                  background: none; border: 0; border-radius: .35rem; color: var(--muted); }
li .acts button:hover { background: var(--bg); color: var(--fg); }
li .acts button.rm:hover { color: var(--danger); }
li.busy { opacity: .5; }

#note { margin-top: 1rem; font-size: .8rem; color: var(--muted); }
#err { margin-top: 1rem; font-size: .85rem; color: var(--danger); min-height: 1.2em; }
.empty { color: var(--muted); font-size: .9rem; padding: 1.2rem 0; text-align: center; }

#lock { max-width: 17rem; margin: 15vh auto 0; text-align: center; }
#lock h1 { margin-bottom: .2rem; }
#lock input { width: 100%; margin: .4rem 0 .6rem; padding: .7rem; font: inherit; text-align: center;
              letter-spacing: .25em; background: var(--card); color: var(--fg);
              border: 1px solid var(--border); border-radius: .5rem; }
#lock button { width: 100%; padding: .65rem; font: inherit; font-weight: 600; cursor: pointer;
               background: var(--accent); color: var(--bg); border: 0; border-radius: .5rem; }
#lock button:disabled { opacity: .5; cursor: default; }
#loading { margin: 15vh auto 0; text-align: center; color: var(--muted); }
#lockerr { margin-top: .7rem; font-size: .85rem; color: var(--danger); min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <!-- Shown from the very first paint, before any request has been answered. Without it the
       page is blank until the server replies -- which, on a cold start from a phone, is seconds
       of white screen with nothing to say it is working. Replaced by the lock or the files. -->
  <p id="loading">Opening&hellip;</p>

  <!-- The lock screen. Shown instead of everything else until the PIN is accepted; the server
       sends nothing about the room until then, so there is nothing here to peek at. -->
  <form id="lock" hidden>
    <h1>Locked</h1>
    <p class="sub">Enter the PIN to open the files.</p>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off"
           autocapitalize="off" spellcheck="false" placeholder="PIN" aria-label="PIN">
    <button type="submit" id="unlock">Open</button>
    <div id="lockerr" role="alert"></div>
  </form>

  <div id="room" hidden>
  <h1 id="title">Files</h1>
  <p class="sub" id="sub"></p>

  <div id="zone" tabindex="0" role="button" aria-label="Add files">
    <strong>Drop files here</strong>
    or tap to choose
  </div>
  <input type="file" id="picker" multiple hidden>
  <input type="text" id="tagbox" placeholder="Tag for the next upload (optional) — e.g. photos, refs" maxlength="40">

  <div id="filters"></div>
  <ul id="list"></ul>
  <div id="err" role="alert"></div>
  <p id="note"></p>
  </div>
</main>
<script>window.ROOM={api:"https://files.second-first.workers.dev",id:"8cb5ae6aa7fde9fcf1711096beac51bc"}</script>
<script src="room.js"></script>
</body>
</html>
